# Enable Gradle toolchain auto-provisioning
# This allows Gradle to automatically download JDK 21 if not found
org.gradle.java.installations.auto-download=true

# Specify custom Java installation paths
org.gradle.java.installations.paths=/opt/homebrew/opt/openjdk@21/libexec/openjdk.jdk/Contents/Home

# Optional: faster builds
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
